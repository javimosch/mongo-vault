version: "3.8"

services:
  app:
    build: .
    ports:
      - "3011:3011"
    volumes:
      - ./data:/app/data
    env_file: .env
    restart: unless-stopped

  # Optional: bundled MongoDB for single-server setups
  # Remove if pointing to an external MongoDB via MONGODB_URI
  mongo:
    image: mongo:7
    profiles:
      - with-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
